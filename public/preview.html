<section class="category container">
  <h1>Project Preview</h1>
  <p class="preview-intro">Fast preview page for a selected project. Use the button below to watch the video or download the build.</p>
  <div class="preview-card">
    <div class="preview-preview">
      <video id="preview-video" controls>
        <source id="preview-source" src="" type="video/mp4">
        Your browser does not support the video element.
      </video>
    </div>
    <div class="preview-details">
      <h2 id="preview-title"></h2>
      <p id="preview-description"></p>
      <div id="preview-tags" class="project-tags"></div>
      <div class="preview-actions" id="preview-actions"></div>
    </div>
  </div>
</section>

<script>
const previewData = {
  'Clinique (Android)': {
    title: 'Clinique (Android)',
    description: 'The video you are seeing is just the preview. their are more features in the full app!',
    tags: ['Android', 'Spaced Repetition'],
    video: 'static/videos/clinique.mp4',
    actions: [
      { label: 'Download APK', href: 'static/downloads/clinique.zip', download: true }
    ]
  },
  'AI Ecosystem 3d (Python)': {
    title: 'AI Ecosystem 3d (Python)',
    description: 'This application simulates an ecosystem of AI agents in a 3D environement. The agents are controlled by neural networks and can evolve over time. The simulation is built using Python. Make sure read the readme file in the source download for instructions on how to run the simulation.',
    tags: ['Simulation', 'Neural Networks', 'Python'],
    video: 'static/videos/CSA.mp4',
    actions: [
      { label: 'Download Source', href: 'static/downloads/AI-Ecosystem-3D.zip', download: true }
    ]
  }
};

function populatePreview() {
  const params = new URLSearchParams(window.location.search);
  const title = params.get('project');
  const data = title ? previewData[title] : null;

  if (!data) {
    document.getElementById('preview-title').textContent = 'Project not found';
    document.getElementById('preview-description').textContent = 'Select a project from the portfolio pages.';
    document.getElementById('preview-actions').innerHTML = '';
    return;
  }

  document.getElementById('preview-title').textContent = data.title;
  document.getElementById('preview-description').textContent = data.description;
  document.getElementById('preview-tags').innerHTML = data.tags.map(tag => `<span>${tag}</span>`).join(' · ');
  document.getElementById('preview-source').src = data.video;
  document.getElementById('preview-video').load();

  document.getElementById('preview-actions').innerHTML = data.actions.map(action => {
    const downloadAttr = action.download ? ' download' : '';
    return `<a href="${action.href}" class="button"${downloadAttr}>${action.label}</a>`;
  }).join(' ');
}

populatePreview();
</script>
</main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal');
            
            const revealOnScroll = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.05,
                rootMargin: '0px 0px -40px 0px'
            });

            reveals.forEach(reveal => {
                revealOnScroll.observe(reveal);
            });

            // Mobile menu toggle
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            const mainNav = document.querySelector('.main-nav');
            const navOverlay = document.querySelector('.nav-overlay');
            const navLinks = document.querySelectorAll('.main-nav a');

            function toggleMenu() {
                mobileMenuBtn.classList.toggle('active');
                mainNav.classList.toggle('active');
                navOverlay.classList.toggle('active');
                document.body.style.overflow = mainNav.classList.contains('active') ? 'hidden' : '';
            }

            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', toggleMenu);
            }

            if (navOverlay) {
                navOverlay.addEventListener('click', toggleMenu);
            }

            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (mainNav.classList.contains('active')) {
                        toggleMenu();
                    }
                });
            });
        });
    </script>
</body>
