<section class="category container reveal">
  <h1>Mobile Development</h1>
  <p>Android apps and utilities. Each entry includes screenshots and an APK or source download.</p>
  <div id="project-grid"></div>
</section>

<script>
const projects = [
  {
    name: 'Clinique (Android)',
    description: 'This is our final project in Mobile Development, in which we were tasked to create a health-related app. After downloading the APK, please make sure to install it on an Android device.',
    tags: ['Android', 'Firestore', "Java"],
    link: 'static/demos/clinique/',
    icon: '💊',
    image: 'static/images/clinique.jpg',
    imageAlt: 'Mobile 1',
    actions: [
      { label: 'Watch preview', href: 'preview.html?project=Clinique%20(Android)' },
      { label: 'Download APK', href: 'static/downloads/clinique.zip', download: true }
    ]
  },
];



function renderProjects(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const list = document.createElement('ul');
  list.className = 'project-list';

  list.innerHTML = projects.map((project, index) => {
    const actions = project.actions.map(action => {
      const downloadAttr = action.download ? ' download' : '';
      const targetAttr = action.target ? ` target="${action.target}"` : '';
      return `<a href="${action.href}"${targetAttr}${downloadAttr}>${action.label}</a>`;
    }).join(' • ');

    const tags = project.tags.length ? `<div class="project-tags">${project.tags.map(tag => `<span>${tag}</span>`).join('')}</div>` : '';

    return `
      <li class="project-card reveal" style="transition-delay: ${(index + 1) * 0.15}s;">
        <img src="${project.image}" alt="${project.imageAlt}">
        <div>
          <h3>${project.icon} ${project.name}</h3>
          <p>${project.description}</p>
          ${tags}
          <p>${actions}</p>
        </div>
      </li>
    `;
  }).join('');

  container.appendChild(list);
}

renderProjects('project-grid');
</script>
</main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal');
            
            const revealOnScroll = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.05,
                rootMargin: '0px 0px -40px 0px'
            });

            reveals.forEach(reveal => {
                revealOnScroll.observe(reveal);
            });

            // Mobile menu toggle
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            const mainNav = document.querySelector('.main-nav');
            const navOverlay = document.querySelector('.nav-overlay');
            const navLinks = document.querySelectorAll('.main-nav a');

            function toggleMenu() {
                mobileMenuBtn.classList.toggle('active');
                mainNav.classList.toggle('active');
                navOverlay.classList.toggle('active');
                document.body.style.overflow = mainNav.classList.contains('active') ? 'hidden' : '';
            }

            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', toggleMenu);
            }

            if (navOverlay) {
                navOverlay.addEventListener('click', toggleMenu);
            }

            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (mainNav.classList.contains('active')) {
                        toggleMenu();
                    }
                });
            });
        });
    </script>
</body>
